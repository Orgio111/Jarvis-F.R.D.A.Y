[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-engine"
version = "0.1.0"
description = "Ruflo — deterministic workflow execution engine with task pipelines and retry flows"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["workflow_engine*"]
