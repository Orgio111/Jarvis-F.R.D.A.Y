[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "self-evolution"
version = "0.1.0"
description = "Self-Evolution Engine — continuous system optimization through mutation, scoring, and reinforcement learning"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["self_evolution*"]
