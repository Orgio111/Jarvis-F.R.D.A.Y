[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "memory-fabric"
version = "0.1.0"
description = "Multi-layered cognitive memory — Episodic, Semantic, and Procedural memory fabrics for JARVIS"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_fabric*"]
